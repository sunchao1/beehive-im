apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: beehive
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:4.4
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: root
            - name: MONGO_INITDB_ROOT_PASSWORD
              value: "111111"
          ports:
            - containerPort: 27017
          readinessProbe:
            exec:
              command:
                - mongo
                - --quiet
                - mongodb://root:111111@127.0.0.1:27017/admin
                - --eval
                - db.runCommand({ ping: 1 })
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: beehive
spec:
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
